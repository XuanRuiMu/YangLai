<h1>🌞 隐私政策</h1>
<p>生效版本：v1（纯前端单页，无服务端）。</p>
<h2>一、我们收集什么</h2>
<p>不收集。昵称、战绩、成就、弹幕偏好、黑名单、错误记录、反馈均只保存在你本机浏览器的 localStorage，不上传任何服务器。</p>
<h2>二、存在哪里</h2>
<p>仅本机 localStorage；清理浏览器数据即删除。隐私模式下可能写不进，此时仅本会话有效。</p>
<h2>三、第三方</h2>
<p>无第三方统计、无外部上报；3D 渲染库 three.js（MIT License）随页面本地加载，不回传数据。</p>
<h2>四、未成年人</h2>
<p>建议在家长指导下使用；可开启站内「未成年模式」关闭频闪并定时休息提醒。</p>
